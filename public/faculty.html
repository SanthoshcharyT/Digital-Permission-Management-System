<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Dashboard - Digital Permission System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
        }

        .main-container {
            padding: 2rem 0;
        }

        .dashboard-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            margin-bottom: 2rem;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .request-card {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            border-left: 4px solid #e9ecef;
        }

        .request-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .request-card.pending {
            border-left-color: #ffc107;
        }

        .request-card.approved {
            border-left-color: #28a745;
        }

        .request-card.rejected {
            border-left-color: #dc3545;
        }

        .request-card.need-more-info {
            border-left-color: #17a2b8;
        }

        .status-badge {
            font-size: 0.8rem;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-weight: 600;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-approved {
            background: #d4edda;
            color: #155724;
        }

        .status-rejected {
            background: #f8d7da;
            color: #721c24;
        }

        .status-need-more-info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .btn-sm {
            padding: 0.375rem 0.75rem;
            font-size: 0.8rem;
            border-radius: 8px;
            margin: 0.1rem;
        }

        .btn-success {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            border: none;
        }

        .btn-danger {
            background: linear-gradient(135deg, #dc3545 0%, #e83e8c 100%);
            border: none;
        }

        .btn-warning {
            background: linear-gradient(135deg, #ffc107 0%, #fd7e14 100%);
            border: none;
        }

        .btn-info {
            background: linear-gradient(135deg, #17a2b8 0%, #6f42c1 100%);
            border: none;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .file-info {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 0.5rem;
            margin-top: 0.5rem;
            font-size: 0.85rem;
        }

        .no-requests {
            text-align: center;
            padding: 3rem;
            color: #6c757d;
        }

        .no-requests i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .student-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .filter-buttons {
            margin-bottom: 1.5rem;
        }

        .filter-btn {
            margin: 0.2rem;
            border-radius: 20px;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
        }

        .modal-content {
            border-radius: 15px;
            border: none;
        }

        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0;
        }

        .form-control,
        .form-select {
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 0.75rem;
            transition: all 0.3s ease;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="fas fa-graduation-cap me-2"></i>
                Digital Permission System
            </a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3">
                    <i class="fas fa-user-tie me-2"></i>
                    Welcome, <span id="facultyName">Faculty</span>
                </span>
                <button class="btn btn-outline-danger btn-sm" onclick="logout()">
                    <i class="fas fa-sign-out-alt me-2"></i>Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="container main-container">
        <div class="row">
            <div class="col-lg-3">
                <div class="dashboard-card">
                    <h4 class="mb-4">
                        <i class="fas fa-chart-pie me-2"></i>
                        Request Statistics
                    </h4>
                    <div class="row text-center">
                        <div class="col-12 mb-3">
                            <div class="p-3 bg-warning bg-opacity-10 rounded">
                                <h5 class="text-warning mb-1" id="pendingCount">0</h5>
                                <small class="text-muted">Pending</small>
                            </div>
                        </div>
                        <div class="col-12 mb-3">
                            <div class="p-3 bg-success bg-opacity-10 rounded">
                                <h5 class="text-success mb-1" id="approvedCount">0</h5>
                                <small class="text-muted">Approved</small>
                            </div>
                        </div>
                        <div class="col-12 mb-3">
                            <div class="p-3 bg-danger bg-opacity-10 rounded">
                                <h5 class="text-danger mb-1" id="rejectedCount">0</h5>
                                <small class="text-muted">Rejected</small>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="p-3 bg-info bg-opacity-10 rounded">
                                <h5 class="text-info mb-1" id="needInfoCount">0</h5>
                                <small class="text-muted">Need Info</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-9">
                <div class="dashboard-card">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h3 class="mb-0">
                            <i class="fas fa-list me-2"></i>
                            Student Permission Requests
                        </h3>
                        <button class="btn btn-outline-primary btn-sm" onclick="loadRequests()">
                            <i class="fas fa-sync-alt me-2"></i>Refresh
                        </button>
                    </div>

                    <div class="filter-buttons">
                        <button class="btn btn-outline-secondary filter-btn active" onclick="filterRequests('all')">
                            All Requests
                        </button>
                        <button class="btn btn-outline-warning filter-btn" onclick="filterRequests('Pending')">
                            Pending
                        </button>
                        <button class="btn btn-outline-success filter-btn" onclick="filterRequests('Approved')">
                            Approved
                        </button>
                        <button class="btn btn-outline-danger filter-btn" onclick="filterRequests('Rejected')">
                            Rejected
                        </button>
                        <button class="btn btn-outline-info filter-btn" onclick="filterRequests('Need More Info')">
                            Need More Info
                        </button>
                    </div>

                    <div id="requestsContainer">
                        <div class="text-center py-4">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-2 text-muted">Loading requests...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Status Update Modal -->
    <div class="modal fade" id="statusModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-edit me-2"></i>
                        Update Request Status
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="statusForm">
                        <input type="hidden" id="requestId">
                        <div class="mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-select" id="status" name="status" required>
                                <option value="Pending">Pending</option>
                                <option value="Approved">Approved</option>
                                <option value="Rejected">Rejected</option>
                                <option value="Need More Info">Need More Info</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="comment" class="form-label">Comment (Optional)</label>
                            <textarea class="form-control" id="comment" name="comment" rows="3"
                                placeholder="Add any additional comments or instructions..."></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="updateStatus()">
                        <i class="fas fa-save me-2"></i>Update Status
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        let socket;
        let user;
        let allRequests = [];
        let currentFilter = 'all';

        // Initialize
        document.addEventListener('DOMContentLoaded', function () {
            checkAuth();
            initializeSocket();
            loadRequests();
        });

        function checkAuth() {
            const token = localStorage.getItem('token');
            const userData = localStorage.getItem('user');

            if (!token || !userData) {
                window.location.href = '/';
                return;
            }

            try {
                user = JSON.parse(userData);
                if (user.role !== 'faculty') {
                    window.location.href = '/';
                    return;
                }
                document.getElementById('facultyName').textContent = user.name;
            } catch (error) {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = '/';
            }
        }

        function initializeSocket() {
            socket = io();
            socket.emit('join_room', { role: 'faculty', userId: user.id });

            socket.on('new_request', function (request) {
                loadRequests();
            });
        }

        async function loadRequests() {
            try {
                const response = await fetch('/api/faculty/requests', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                if (response.ok) {
                    allRequests = await response.json();
                    displayRequests(allRequests);
                    updateStatistics(allRequests);
                } else {
                    throw new Error('Failed to load requests');
                }
            } catch (error) {
                console.error('Load requests error:', error);
                document.getElementById('requestsContainer').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        Failed to load requests. Please refresh the page.
                    </div>
                `;
            }
        }

        function filterRequests(status) {
            currentFilter = status;


            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            let filteredRequests = allRequests;
            if (status !== 'all') {
                filteredRequests = allRequests.filter(request => request.status === status);
            }

            displayRequests(filteredRequests);
        }

        function displayRequests(requests) {
            const container = document.getElementById('requestsContainer');

            if (requests.length === 0) {
                container.innerHTML = `
                    <div class="no-requests">
                        <i class="fas fa-inbox"></i>
                        <h5>No requests found</h5>
                        <p>${currentFilter === 'all' ? 'No permission requests have been submitted yet.' : `No ${currentFilter.toLowerCase()} requests found.`}</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = requests.map(request => `
                <div class="request-card ${request.status.toLowerCase().replace(' ', '-')}">
                    <div class="student-info">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="mb-1">${request.student_name}</h6>
                                <small class="opacity-75">${request.student_email}</small>
                            </div>
                            <span class="status-badge status-${request.status.toLowerCase().replace(' ', '-')}">
                                ${request.status}
                            </span>
                        </div>
                    </div>
                    
                    <div class="mt-3">
                        <h6>Request #${request.id}</h6>
                        <p class="text-muted mb-2">${request.reason}</p>
                        
                        <div class="row mb-2">
                            <div class="col-md-6">
                                <small class="text-muted">
                                    <i class="fas fa-calendar me-1"></i>
                                    Requested for: ${new Date(request.date_time).toLocaleString()}
                                </small>
                            </div>
                            <div class="col-md-6">
                                <small class="text-muted">
                                    <i class="fas fa-clock me-1"></i>
                                    Submitted: ${new Date(request.created_at).toLocaleDateString()}
                                </small>
                            </div>
                        </div>
                        
                        ${request.file_path ? `
                            <div class="file-info">
                                <i class="fas fa-paperclip me-1"></i>
                                <a href="/${request.file_path}" target="_blank" class="text-decoration-none">
                                    View attached file
                                </a>
                            </div>
                        ` : ''}
                        
                        ${request.faculty_comment ? `
                            <div class="mt-2 p-2 bg-light rounded">
                                <small class="text-muted">
                                    <strong>Previous Comment:</strong> ${request.faculty_comment}
                                </small>
                            </div>
                        ` : ''}
                        
                        <div class="mt-3">
                            ${request.status === 'Pending' ? `
                                <button class="btn btn-success btn-sm" onclick="openStatusModal(${request.id}, 'Approved')">
                                    <i class="fas fa-check me-1"></i>Approve
                                </button>
                                <button class="btn btn-danger btn-sm" onclick="openStatusModal(${request.id}, 'Rejected')">
                                    <i class="fas fa-times me-1"></i>Reject
                                </button>
                                <button class="btn btn-info btn-sm" onclick="openStatusModal(${request.id}, 'Need More Info')">
                                    <i class="fas fa-question me-1"></i>Need More Info
                                </button>
                            ` : `
                                <button class="btn btn-warning btn-sm" onclick="openStatusModal(${request.id}, '${request.status}')">
                                    <i class="fas fa-edit me-1"></i>Update Status
                                </button>
                            `}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateStatistics(requests) {
            const stats = {
                pending: 0,
                approved: 0,
                rejected: 0,
                'need-more-info': 0
            };

            requests.forEach(request => {
                const status = request.status.toLowerCase().replace(' ', '-');
                if (stats.hasOwnProperty(status)) {
                    stats[status]++;
                }
            });

            document.getElementById('pendingCount').textContent = stats.pending;
            document.getElementById('approvedCount').textContent = stats.approved;
            document.getElementById('rejectedCount').textContent = stats.rejected;
            document.getElementById('needInfoCount').textContent = stats['need-more-info'];
        }

        function openStatusModal(requestId, status) {
            document.getElementById('requestId').value = requestId;
            document.getElementById('status').value = status;
            document.getElementById('comment').value = '';

            const modal = new bootstrap.Modal(document.getElementById('statusModal'));
            modal.show();
        }

        async function updateStatus() {
            const requestId = document.getElementById('requestId').value;
            const status = document.getElementById('status').value;
            const comment = document.getElementById('comment').value;

            try {
                const response = await fetch(`/api/requests/${requestId}/status`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({ status, comment })
                });

                const data = await response.json();

                if (response.ok) {
                    // Close modal
                    const modal = bootstrap.Modal.getInstance(document.getElementById('statusModal'));
                    modal.hide();

                    // Reload requests
                    loadRequests();
                } else {
                    alert(data.error || 'Failed to update status');
                }
            } catch (error) {
                console.error('Update status error:', error);
                alert('Network error. Please try again.');
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/';
        }
    </script>
</body>

</html>
