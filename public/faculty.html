<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Dashboard - Digital Permission System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-dark: #0f1117;
            --bg-panel: #13151f;
            --bg-card: #1a1d2e;
            --bg-input: #1e2235;
            --border: #2a2d3e;
            --accent: #6c63ff;
            --accent-hover: #5a52e0;
            --accent-muted: rgba(108, 99, 255, 0.15);
            --text-primary: #f0f1f6;
            --text-secondary: #8b8fa8;
            --text-muted: #5a5f7a;
            --highlight: #a78bfa;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #38bdf8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* ── NAVBAR ── */
        .top-nav {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            padding: 0.85rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.7rem;
        }

        .nav-brand .brand-icon {
            width: 36px;
            height: 36px;
            background: var(--accent);
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            color: #fff;
        }

        .nav-brand .brand-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .welcome-text {
            font-size: 0.82rem;
            color: var(--text-secondary);
        }

        .welcome-text span {
            color: var(--text-primary);
            font-weight: 500;
        }

        .btn-logout,
        .btn-ghost {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.45rem 0.9rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            border-color: var(--danger);
            color: var(--danger);
        }

        .btn-ghost:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }

        /* ── LAYOUT ── */
        .main-wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .page-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 1.5rem;
        }

        .page-title span {
            color: var(--highlight);
        }

        /* ── STAT CARDS ── */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.1rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.9rem;
        }

        .stat-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .stat-icon.warning {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
        }

        .stat-icon.success {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
        }

        .stat-icon.danger {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }

        .stat-icon.info {
            background: rgba(56, 189, 248, 0.15);
            color: var(--info);
        }

        .stat-val {
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1;
        }

        .stat-val.warning {
            color: var(--warning);
        }

        .stat-val.success {
            color: var(--success);
        }

        .stat-val.danger {
            color: var(--danger);
        }

        .stat-val.info {
            color: var(--info);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* ── CARDS ── */
        .card-dark {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.6rem;
            margin-bottom: 1.5rem;
        }

        .card-head-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.1rem;
        }

        .card-heading {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-heading i {
            color: var(--accent);
        }

        /* ── FILTERS ── */
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.2rem;
        }

        .filter-pill {
            padding: 0.4rem 0.9rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-secondary);
            font-family: 'Inter', sans-serif;
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-pill:hover {
            color: var(--text-primary);
            border-color: var(--accent);
        }

        .filter-pill.active {
            background: var(--accent-muted);
            border-color: var(--accent);
            color: var(--text-primary);
        }

        /* ── FORM (status dialog) ── */
        .field-label {
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }

        .form-row {
            margin-bottom: 1rem;
        }

        .dark-select,
        .dark-textarea {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.7rem 0.9rem;
            font-size: 0.87rem;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            appearance: none;
        }

        .dark-textarea::placeholder {
            color: var(--text-muted);
        }

        .dark-select:focus,
        .dark-textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.15);
        }

        .dark-select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%238b8fa8' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.7rem center;
            background-size: 1.2em;
            padding-right: 2.4rem;
        }

        .dark-select option {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .dark-textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn-submit {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.65rem 1.4rem;
            background: var(--accent);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-submit:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(108, 99, 255, 0.3);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── ALERT ── */
        .custom-alert {
            border-radius: 10px;
            padding: 0.7rem 1rem;
            font-size: 0.83rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .custom-alert.alert-danger {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f98080;
        }

        /* ── REQUEST CARDS ── */
        .request-item {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-left: 4px solid var(--border);
            border-radius: 12px;
            padding: 1.1rem 1.2rem;
            margin-bottom: 0.85rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .request-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        }

        .request-item.pending {
            border-left-color: var(--warning);
        }

        .request-item.approved {
            border-left-color: var(--success);
        }

        .request-item.rejected {
            border-left-color: var(--danger);
        }

        .request-item.need-more-info {
            border-left-color: var(--info);
        }

        .req-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 0.6rem;
        }

        .req-student {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            min-width: 0;
        }

        .student-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent-muted);
            color: var(--highlight);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 600;
            flex-shrink: 0;
        }

        .student-name {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .student-email {
            font-size: 0.75rem;
            color: var(--text-muted);
            overflow-wrap: anywhere;
        }

        .req-id {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.3rem;
        }

        .status-badge {
            font-size: 0.72rem;
            font-weight: 600;
            padding: 0.3rem 0.7rem;
            border-radius: 20px;
            white-space: nowrap;
        }

        .badge-pending {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
        }

        .badge-approved {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
        }

        .badge-rejected {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }

        .badge-need-more-info {
            background: rgba(56, 189, 248, 0.15);
            color: var(--info);
        }

        .req-reason {
            font-size: 0.83rem;
            color: var(--text-secondary);
            margin-bottom: 0.6rem;
            line-height: 1.5;
        }

        .req-meta {
            display: flex;
            gap: 1.2rem;
            flex-wrap: wrap;
        }

        .req-meta span {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .req-file {
            margin-top: 0.6rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.78rem;
            color: var(--accent);
            text-decoration: none;
            background: var(--accent-muted);
            padding: 0.3rem 0.7rem;
            border-radius: 6px;
        }

        .req-comment {
            margin-top: 0.7rem;
            padding: 0.6rem 0.8rem;
            background: var(--bg-card);
            border-radius: 8px;
            font-size: 0.78rem;
            color: var(--text-secondary);
            border-left: 3px solid var(--accent);
        }

        .req-comment strong {
            color: var(--text-primary);
        }

        /* Action buttons */
        .req-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.9rem;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.4rem 0.85rem;
            border-radius: 8px;
            border: 1px solid transparent;
            font-family: 'Inter', sans-serif;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-action.approve {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
        }

        .btn-action.approve:hover {
            border-color: var(--success);
        }

        .btn-action.reject {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }

        .btn-action.reject:hover {
            border-color: var(--danger);
        }

        .btn-action.info {
            background: rgba(56, 189, 248, 0.15);
            color: var(--info);
        }

        .btn-action.info:hover {
            border-color: var(--info);
        }

        .btn-action.update {
            background: var(--accent-muted);
            color: var(--highlight);
        }

        .btn-action.update:hover {
            border-color: var(--accent);
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 2.5rem;
            margin-bottom: 0.8rem;
            opacity: 0.4;
        }

        .empty-state h6 {
            color: var(--text-secondary);
            margin-bottom: 0.3rem;
        }

        .empty-state p {
            font-size: 0.83rem;
        }

        /* Loading spinner */
        .page-loader {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .page-loader .spin-ring {
            width: 28px;
            height: 28px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 0.6rem;
        }

        /* ── STATUS DIALOG ── */
        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            color: var(--text-primary);
        }

        .modal-header,
        .modal-footer {
            border-color: var(--border);
            padding: 1.1rem 1.4rem;
        }

        .modal-body {
            padding: 1.4rem;
        }

        .modal-title {
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .modal-title i {
            color: var(--accent);
        }

        .modal-backdrop.show {
            opacity: 0.7;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }

            .top-nav {
                padding: 0.75rem 1rem;
            }

            .main-wrap {
                padding: 1.2rem 1rem;
            }

            .welcome-text {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="top-nav">
        <div class="nav-brand">
            <div class="brand-icon"><i class="fas fa-graduation-cap"></i></div>
            <div class="brand-name">Digital Permission System</div>
        </div>
        <div class="nav-right">
            <div class="welcome-text">Welcome, <span id="facultyName">Faculty</span></div>
            <button class="btn-logout" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </nav>

    <!-- MAIN -->
    <div class="main-wrap">

        <div class="page-title">Faculty <span>Dashboard</span></div>

        <!-- STATS -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-icon warning"><i class="fas fa-hourglass-half"></i></div>
                <div>
                    <div class="stat-val warning" id="pendingCount">0</div>
                    <div class="stat-label">Pending</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon success"><i class="fas fa-check-circle"></i></div>
                <div>
                    <div class="stat-val success" id="approvedCount">0</div>
                    <div class="stat-label">Approved</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon danger"><i class="fas fa-times-circle"></i></div>
                <div>
                    <div class="stat-val danger" id="rejectedCount">0</div>
                    <div class="stat-label">Rejected</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon info"><i class="fas fa-info-circle"></i></div>
                <div>
                    <div class="stat-val info" id="needInfoCount">0</div>
                    <div class="stat-label">Need Info</div>
                </div>
            </div>
        </div>

        <!-- REQUEST LIST -->
        <div class="card-dark">
            <div class="card-head-row">
                <div class="card-heading">
                    <i class="fas fa-list-ul"></i> Student Permission Requests
                </div>
                <button class="btn-ghost" onclick="loadRequests()">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </div>

            <div class="filter-row">
                <button class="filter-pill active" data-filter="all">All Requests</button>
                <button class="filter-pill" data-filter="Pending">Pending</button>
                <button class="filter-pill" data-filter="Approved">Approved</button>
                <button class="filter-pill" data-filter="Rejected">Rejected</button>
                <button class="filter-pill" data-filter="Need More Info">Need More Info</button>
            </div>

            <div id="requestsContainer">
                <div class="page-loader">
                    <div class="spin-ring"></div>
                    Loading requests...
                </div>
            </div>
        </div>
    </div>

    <!-- Status Update Modal -->
    <div class="modal fade" id="statusModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-edit"></i> Update Request Status
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="modalAlert"></div>
                    <form id="statusForm">
                        <input type="hidden" id="requestId">
                        <div class="form-row">
                            <div class="field-label">Status</div>
                            <select class="dark-select" id="status" name="status" required>
                                <option value="Pending">Pending</option>
                                <option value="Approved">Approved</option>
                                <option value="Rejected">Rejected</option>
                                <option value="Need More Info">Need More Info</option>
                            </select>
                        </div>
                        <div class="form-row" style="margin-bottom:0">
                            <div class="field-label">Comment <span style="color:var(--text-muted)">(Optional)</span>
                            </div>
                            <textarea class="dark-textarea" id="comment" name="comment"
                                placeholder="Add any additional comments or instructions..."></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-ghost" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn-submit" id="saveStatusBtn" onclick="updateStatus()">
                        <i class="fas fa-save"></i> Update Status
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        let socket;
        let user;
        let allRequests = [];
        let currentFilter = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            initializeSocket();
            setupFilters();
            loadRequests();
        });

        function checkAuth() {
            const token = localStorage.getItem('token');
            const userData = localStorage.getItem('user');
            if (!token || !userData) { window.location.href = '/'; return; }
            try {
                user = JSON.parse(userData);
                if (user.role !== 'faculty') { window.location.href = '/'; return; }
                document.getElementById('facultyName').textContent = user.name;
            } catch {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = '/';
            }
        }

        function initializeSocket() {
            // No Socket.IO server on serverless hosts (Vercel): poll for new requests instead
            if (typeof io === 'undefined') { setInterval(loadRequests, 15000); return; }
            socket = io({ auth: { token: localStorage.getItem('token') } });
            socket.on('new_request', () => loadRequests());
        }

        // Request text comes from students, so it is escaped before being placed in the page
        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[ch]);
        }

        function statusClass(status) {
            return status.toLowerCase().replace(/\s+/g, '-');
        }

        function initials(name) {
            return String(name || '?').trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase();
        }

        function setupFilters() {
            document.querySelectorAll('.filter-pill').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderFiltered();
                });
            });
        }

        async function loadRequests() {
            try {
                const res = await fetch('/api/faculty/requests', {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                if (!res.ok) throw new Error();
                allRequests = await res.json();
                renderFiltered();
                updateStatistics(allRequests);
            } catch {
                document.getElementById('requestsContainer').innerHTML = `
                    <div class="custom-alert alert-danger" style="margin:0">
                        <i class="fas fa-exclamation-circle"></i>
                        Failed to load requests. Please refresh.
                    </div>`;
            }
        }

        function renderFiltered() {
            const list = currentFilter === 'all'
                ? allRequests
                : allRequests.filter(r => r.status === currentFilter);
            displayRequests(list);
        }

        function displayRequests(requests) {
            const c = document.getElementById('requestsContainer');
            if (!requests.length) {
                c.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <h6>No requests found</h6>
                        <p>${currentFilter === 'all'
                        ? 'No permission requests have been submitted yet.'
                        : `No ${escapeHtml(currentFilter.toLowerCase())} requests right now.`}</p>
                    </div>`;
                return;
            }
            c.innerHTML = requests.map(r => {
                const s = statusClass(r.status);
                const actions = r.status === 'Pending' ? `
                    <button class="btn-action approve" onclick="openStatusModal(${r.id}, 'Approved')">
                        <i class="fas fa-check"></i> Approve
                    </button>
                    <button class="btn-action reject" onclick="openStatusModal(${r.id}, 'Rejected')">
                        <i class="fas fa-times"></i> Reject
                    </button>
                    <button class="btn-action info" onclick="openStatusModal(${r.id}, 'Need More Info')">
                        <i class="fas fa-question"></i> Need More Info
                    </button>` : `
                    <button class="btn-action update" onclick="openStatusModal(${r.id}, '${escapeHtml(r.status)}')">
                        <i class="fas fa-edit"></i> Update Status
                    </button>`;
                return `
                <div class="request-item ${s}">
                    <div class="req-header">
                        <div class="req-student">
                            <div class="student-avatar">${escapeHtml(initials(r.student_name))}</div>
                            <div>
                                <div class="student-name">${escapeHtml(r.student_name)}</div>
                                <div class="student-email">${escapeHtml(r.student_email)}</div>
                            </div>
                        </div>
                        <span class="status-badge badge-${s}">${escapeHtml(r.status)}</span>
                    </div>
                    <div class="req-id"><i class="fas fa-hashtag" style="opacity:0.5;font-size:0.7rem"></i> Request ${r.id}</div>
                    <div class="req-reason">${escapeHtml(r.reason)}</div>
                    <div class="req-meta">
                        <span><i class="fas fa-calendar-alt"></i>Requested for ${new Date(r.date_time).toLocaleString()}</span>
                        <span><i class="fas fa-clock"></i>Submitted ${new Date(r.created_at).toLocaleDateString()}</span>
                        <span><i class="fas fa-hourglass-start"></i>${r.expected_duration_days} day${r.expected_duration_days == 1 ? '' : 's'}</span>
                    </div>
                    ${r.file_path ? `
                        <a class="req-file" href="/${escapeHtml(r.file_path)}" target="_blank" rel="noopener">
                            <i class="fas fa-paperclip"></i> View attached file
                        </a>` : ''}
                    ${r.faculty_comment ? `
                        <div class="req-comment">
                            <strong>Your comment:</strong> ${escapeHtml(r.faculty_comment)}
                        </div>` : ''}
                    <div class="req-actions">${actions}</div>
                </div>`;
            }).join('');
        }

        function updateStatistics(requests) {
            const stats = { pending: 0, approved: 0, rejected: 0, 'need-more-info': 0 };
            requests.forEach(r => {
                const s = statusClass(r.status);
                if (s in stats) stats[s]++;
            });
            document.getElementById('pendingCount').textContent = stats.pending;
            document.getElementById('approvedCount').textContent = stats.approved;
            document.getElementById('rejectedCount').textContent = stats.rejected;
            document.getElementById('needInfoCount').textContent = stats['need-more-info'];
        }

        function openStatusModal(requestId, status) {
            document.getElementById('requestId').value = requestId;
            document.getElementById('status').value = status;
            document.getElementById('comment').value = '';
            document.getElementById('modalAlert').innerHTML = '';
            bootstrap.Modal.getOrCreateInstance(document.getElementById('statusModal')).show();
        }

        function showModalError(message) {
            document.getElementById('modalAlert').innerHTML = `
                <div class="custom-alert alert-danger">
                    <i class="fas fa-exclamation-circle"></i> ${escapeHtml(message)}
                </div>`;
        }

        async function updateStatus() {
            const requestId = document.getElementById('requestId').value;
            const status = document.getElementById('status').value;
            const comment = document.getElementById('comment').value;
            const btn = document.getElementById('saveStatusBtn');
            btn.disabled = true;
            try {
                const res = await fetch(`/api/requests/${requestId}/status`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({ status, comment })
                });
                const data = await res.json();
                if (res.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('statusModal')).hide();
                    loadRequests();
                } else {
                    showModalError(data.error || 'Failed to update status.');
                }
            } catch {
                showModalError('Network error. Please try again.');
            } finally {
                btn.disabled = false;
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/';
        }
    </script>
</body>

</html>
